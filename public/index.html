<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1320" />
  <meta name="description" content="GASS-KNUST Academic & Resource Portal - Statistics for Development" />
  <title>GASS-KNUST Student Portal</title>

  <!-- Official Telegram WebApp JavaScript SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="icon" type="image/png" href="img/logo.png" />
  <!-- Google Fonts: Outfit (Display) & Plus Jakarta Sans (UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- GASS Brand Stylesheets -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

  <!-- Top App Header -->
  <header class="app-header">
    <div class="brand-badge">
      <div class="brand-icon">
        <img src="img/logo.png" alt="GASS" style="width: 100%; height: 100%; object-fit: contain; border-radius: inherit;" />
      </div>
      <div class="brand-text">
        <h1>GASS-KNUST</h1>
        <p>Statistics for Development</p>
      </div>
    </div>
    <div class="user-profile-badge">
      <div class="user-avatar" id="header-avatar">S</div>
      <span id="header-username">Scholar</span>
    </div>
  </header>

  <!-- Dynamic Views Root -->
  <main id="app-view-root" class="view-container"></main>

  <!-- Toast Notification -->
  <div id="app-toast" class="toast"></div>

  <!-- Persistent Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <a href="#home" class="nav-item active" data-view="home">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span>Home</span>
    </a>
    <a href="#academic" class="nav-item" data-view="academic">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
      <span>Courses</span>
    </a>
    <a href="#beyond" class="nav-item" data-view="beyond">
      <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
      <span>Beyond</span>
    </a>
    <a href="#search" class="nav-item" data-view="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <span>Search</span>
    </a>
    <a href="#saved" class="nav-item" data-view="saved">
      <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
      <span>Saved</span>
    </a>
  </nav>

  <!-- Modular Scripts -->
  <script src="js/telegram.js"></script>
  <script src="js/api.js"></script>
  <script src="js/views/homeView.js"></script>
  <script src="js/views/academicView.js"></script>
  <script src="js/views/courseDetailView.js"></script>
  <script src="js/views/beyondView.js"></script>
  <script src="js/views/searchView.js"></script>
  <script src="js/views/bookmarksView.js"></script>
  <script src="js/views/requestModal.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
